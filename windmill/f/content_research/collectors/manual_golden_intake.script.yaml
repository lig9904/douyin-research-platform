summary: Manual bounded TikHub golden intake
description: |
  Preview by default. Paid execution is limited to one low-fan page, at most
  five items, two uncached calls, zero retries, and USD 0.01. It requires the
  authenticated writer allowlist and an exact confirmation string.
lock: '!inline f/content_research/collectors/manual_golden_intake.script.lock'
concurrency_time_window_s: 0
concurrent_limit: 1
schema:
  type: object
  properties:
    confirmation:
      type: string
      description: Use RUN_TIKHUB_GOLDEN_PAID only for an intentional paid run.
      default: ''
    date_window_hours:
      type: integer
      default: 24
      minimum: 1
      maximum: 24
    db:
      type: object
      default: null
      format: resource-postgresql
    enrich_details:
      type: boolean
      default: true
    execute:
      type: boolean
      description: False performs a zero-call preview without reading Provider secrets.
      default: false
    force_refresh:
      type: boolean
      description: Bypass discovery cache while retaining all call and cost bounds.
      default: false
    max_cost_usd:
      type: number
      default: 0.01
      minimum: 0
      maximum: 0.01
    max_external_calls:
      type: integer
      default: 2
      minimum: 1
      maximum: 2
    max_items:
      type: integer
      default: 5
      minimum: 1
      maximum: 5
  required:
    - db
timeout: 180
