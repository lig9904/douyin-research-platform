summary: Ingest one video and extract private audio
description: |
  Reuses persisted TikHub detail data. Private S3 storage and audio runtime are
  configured only through server-side Secrets/configuration. No paid API calls,
  privacy approvals, arbitrary URLs or caller-supplied worker identity.
concurrent_limit: 2
concurrency_time_window_s: 0
timeout: 900
lock: '!inline f/content_research/collectors/ingest_video_media.script.lock'
schema:
  type: object
  properties:
    video_id:
      type: string
      description: Existing internal source_video UUID, not a download URL.
  required:
    - video_id
