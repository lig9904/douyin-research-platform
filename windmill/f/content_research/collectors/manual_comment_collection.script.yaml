summary: Manual bounded comment collection
description: |
  Preview by default. Project-scoped paid collection requires exact confirmation,
  same-day budget, accepted video and active researcher access. Feature rebuild
  is a separate zero-API operation for previously stored comment evidence.
lock: '!inline f/content_research/collectors/manual_comment_collection.script.lock'
concurrency_time_window_s: 0
concurrent_limit: 1
schema:
  type: object
  properties:
    confirmation:
      type: string
      description: Exact paid-operation confirmation; required only when execute=true.
      default: ''
      originalType: string
    count:
      type: integer
      default: 20
      maximum: 20
      minimum: 1
    cursor:
      type: string
      description: Decimal next_cursor from previous run; 0 starts at the first page.
      default: '0'
    db:
      type: object
      default: null
      format: resource-postgresql
    execute:
      type: boolean
      description: Leave false for a zero-call preview.
      default: false
    max_items:
      type: integer
      default: 20
      maximum: 200
      minimum: 1
    max_pages:
      type: integer
      default: 1
      maximum: 10
      minimum: 1
    project_id:
      type: string
      description: Active project UUID; required for execution.
      default: ''
      originalType: string
    rebuild_features_only:
      type: boolean
      description: Rebuild L2 from stored comments without TikHub calls; use REBUILD_COMMENT_FEATURES confirmation.
      default: false
    video_platform_id:
      type: string
      description: Existing Douyin platform video ID. The value is never returned.
      default: null
      originalType: string
  required:
    - db
    - video_platform_id
timeout: 300
