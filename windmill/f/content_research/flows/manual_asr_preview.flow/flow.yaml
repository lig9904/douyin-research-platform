summary: Manual ASR readiness preview
description: |
  Manual-only, zero-call preview with no schedule. It accepts no video or media
  identifier. Paid execution remains disabled until the relay adapter is verified.
value:
  concurrent_limit: 1
  concurrency_time_window_s: 0
  modules:
    - id: preview_asr
      summary: Calculate bounded ASR calls and estimated cost
      value:
        type: script
        path: f/content_research/analysis/manual_asr_preview
        input_transforms:
          provider:
            type: javascript
            expr: flow_input.provider
          model_id:
            type: javascript
            expr: flow_input.model_id
          model_revision:
            type: javascript
            expr: flow_input.model_revision
          engine_version:
            type: javascript
            expr: flow_input.engine_version
          estimated_api_cost:
            type: javascript
            expr: flow_input.estimated_api_cost
          estimated_asr_cost:
            type: javascript
            expr: flow_input.estimated_asr_cost
          cost_currency:
            type: javascript
            expr: flow_input.cost_currency
          max_polls:
            type: javascript
            expr: flow_input.max_polls
          execute:
            type: javascript
            expr: flow_input.execute
          confirmation:
            type: javascript
            expr: flow_input.confirmation
schema:
  type: object
  properties:
    provider:
      type: string
    model_id:
      type: string
    model_revision:
      type: string
    engine_version:
      type: string
    estimated_api_cost:
      type: number
      minimum: 0
    estimated_asr_cost:
      type: number
      minimum: 0
    cost_currency:
      type: string
      default: CNY
    max_polls:
      type: integer
      minimum: 0
      maximum: 3
      default: 0
    execute:
      type: boolean
      default: false
      description: Must remain false while the adapter is blocked.
    confirmation:
      type: string
      default: ""
  required:
    - provider
    - model_id
    - model_revision
    - engine_version
