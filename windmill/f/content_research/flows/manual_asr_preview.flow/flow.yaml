summary: Manual ASR readiness preview
description: >
  Manual-only, zero-call preview with no schedule. It accepts no video or media

  identifier. Paid execution remains disabled until the relay adapter is
  verified.
value:
  modules:
    - id: preview_asr
      summary: Calculate bounded ASR calls and estimated cost
      value:
        type: script
        input_transforms:
          confirmation:
            type: javascript
            expr: flow_input.confirmation
          cost_currency:
            type: javascript
            expr: flow_input.cost_currency
          engine_version:
            type: javascript
            expr: flow_input.engine_version
          estimated_api_cost:
            type: javascript
            expr: flow_input.estimated_api_cost
          estimated_asr_cost:
            type: javascript
            expr: flow_input.estimated_asr_cost
          execute:
            type: javascript
            expr: flow_input.execute
          max_polls:
            type: javascript
            expr: flow_input.max_polls
          model_id:
            type: javascript
            expr: flow_input.model_id
          model_revision:
            type: javascript
            expr: flow_input.model_revision
          provider:
            type: javascript
            expr: flow_input.provider
        path: f/content_research/analysis/manual_asr_preview
  concurrency_time_window_s: 0
  concurrent_limit: 1
schema:
  type: object
  properties:
    confirmation:
      type: string
      default: ''
    cost_currency:
      type: string
      default: CNY
    engine_version:
      type: string
    estimated_api_cost:
      type: number
      minimum: 0
    estimated_asr_cost:
      type: number
      minimum: 0
    execute:
      type: boolean
      description: Must remain false while the adapter is blocked.
      default: false
    max_polls:
      type: integer
      default: 0
      maximum: 3
      minimum: 0
    model_id:
      type: string
    model_revision:
      type: string
    provider:
      type: string
  required:
    - provider
    - model_id
    - model_revision
    - engine_version
