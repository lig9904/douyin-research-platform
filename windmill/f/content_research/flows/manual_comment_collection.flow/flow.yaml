summary: Manual comment evidence collection
description: |
  Manual-only L2 evidence flow. It defaults to preview and has no schedule.
  Paid execution requires execute=true and the exact confirmation string.
value:
  modules:
    - id: collect_comments
      summary: Guard, fetch, and persist bounded comment evidence
      value:
        type: script
        input_transforms:
          confirmation:
            type: javascript
            expr: flow_input.confirmation
          count:
            type: javascript
            expr: flow_input.count
          db:
            type: static
            value: $res:f/content_research/research_db
          execute:
            type: javascript
            expr: flow_input.execute
          max_items:
            type: javascript
            expr: flow_input.max_items
          max_pages:
            type: javascript
            expr: flow_input.max_pages
          video_platform_id:
            type: javascript
            expr: flow_input.video_platform_id
        path: f/content_research/collectors/manual_comment_collection
  concurrency_time_window_s: 0
  concurrent_limit: 1
schema:
  type: object
  properties:
    confirmation:
      type: string
      description: Use COLLECT_COMMENTS_PAID only for an intentional paid run.
      default: ''
    count:
      type: integer
      default: 20
      maximum: 20
      minimum: 1
    execute:
      type: boolean
      description: False performs a zero-call preview.
      default: false
    max_items:
      type: integer
      default: 20
      maximum: 40
      minimum: 1
    max_pages:
      type: integer
      default: 1
      maximum: 2
      minimum: 1
    video_platform_id:
      type: string
      description: Existing Douyin platform video ID. It is not returned by the flow.
  required:
    - video_platform_id
