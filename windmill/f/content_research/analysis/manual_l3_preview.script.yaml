summary: Preview future manual L3 model execution
description: |
  Zero-call readiness preview only. It does not accept a video ID or evidence
  body, does not use a database resource, and cannot execute a paid model call
  until the model contract and adapter are verified.
lock: '!inline f/content_research/analysis/manual_l3_preview.script.lock'
concurrency_time_window_s: 0
concurrent_limit: 1
schema:
  type: object
  properties:
    confirmation:
      type: string
      description: Does not enable execution until the adapter is verified.
      default: ''
      originalType: string
    cost_currency:
      type: string
      default: CNY
      originalType: string
    estimated_llm_cost:
      type: number
      description: Leave empty when unknown; unknown remains null.
      default: null
      minimum: 0
    execute:
      type: boolean
      description: Paid execution is disabled while adapter_status is blocked.
      default: false
    model_id:
      type: string
      default: null
      originalType: string
    model_revision:
      type: string
      default: null
      originalType: string
    prompt_version:
      type: string
      default: null
      originalType: string
    provider:
      type: string
      description: Planned model provider identifier; no adapter is loaded.
      default: null
      originalType: string
  required:
    - provider
    - model_id
    - model_revision
    - prompt_version
timeout: 30
