summary: Preview future manual L3 model execution
description: |
  Zero-call readiness preview only. It does not accept a video ID or evidence
  body, does not use a database resource, and cannot execute a paid model call
  until the model contract and adapter are verified.
schema:
  type: object
  properties:
    provider:
      type: string
      description: Planned model provider identifier; no adapter is loaded.
    model_id:
      type: string
    model_revision:
      type: string
    prompt_version:
      type: string
    estimated_llm_cost:
      type: number
      minimum: 0
      description: Leave empty when unknown; unknown remains null.
    cost_currency:
      type: string
      default: CNY
    execute:
      type: boolean
      default: false
      description: Paid execution is disabled while adapter_status is blocked.
    confirmation:
      type: string
      default: ""
      description: Does not enable execution until the adapter is verified.
  required:
    - provider
    - model_id
    - model_revision
    - prompt_version
concurrent_limit: 1
concurrency_time_window_s: 0
timeout: 30
