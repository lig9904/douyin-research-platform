summary: Submit or resume ASR for an approved private audio asset
description: Paid ASR may occur. Fixed server configuration; no URLs or credentials accepted from caller. Existing tasks are resumed without resubmission.
timeout: 300
concurrent_limit: 1
schema:
  type: object
  properties:
    video_id:
      type: string
    asset_id:
      type: string
    review_version:
      type: string
    resume_job_id:
      type: string
      description: Optional existing job ID; when set, refuses to create a different task.
  required: [video_id, asset_id, review_version]
