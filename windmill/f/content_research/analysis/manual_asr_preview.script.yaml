summary: Preview future manual ASR execution
description: |
  Zero-call readiness preview only. It does not accept a video ID or media
  reference, does not use a database resource, and cannot execute paid ASR
  until the relay contract and adapter are verified.
schema:
  type: object
  properties:
    provider:
      type: string
      description: Planned ASR provider identifier; no adapter is loaded.
    model_id:
      type: string
    model_revision:
      type: string
    engine_version:
      type: string
    estimated_api_cost:
      type: number
      minimum: 0
      description: Leave empty when unknown; unknown remains null.
    estimated_asr_cost:
      type: number
      minimum: 0
      description: Leave empty when unknown; unknown remains null.
    cost_currency:
      type: string
      default: CNY
    max_polls:
      type: integer
      minimum: 0
      maximum: 3
      default: 0
    execute:
      type: boolean
      default: false
      description: Paid execution is disabled while adapter_status is blocked.
    confirmation:
      type: string
      default: ""
      description: Does not enable execution until the adapter is verified.
  required:
    - provider
    - model_id
    - model_revision
    - engine_version
concurrent_limit: 1
concurrency_time_window_s: 0
timeout: 30
