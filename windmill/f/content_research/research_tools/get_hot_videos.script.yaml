summary: MCP read - get hot videos
description: |
  Read recent available videos ordered by normalized latest play and engagement
  metrics. This never refreshes data or calls a provider.
lock: '!inline f/content_research/research_tools/get_hot_videos.script.lock'
concurrency_time_window_s: 0
concurrent_limit: 4
schema:
  type: object
  additionalProperties: false
  properties:
    days:
      type: integer
      default: 7
      maximum: 90
      minimum: 1
    limit:
      type: integer
      default: 10
      maximum: 50
      minimum: 1
    platform:
      type: string
      default: ''
      maxLength: 64
      originalType: string
  required: []
timeout: 10
