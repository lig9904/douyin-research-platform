type: inline
summary: 每日研判 - 事实简报
description: 规则排序的合并事实、任务运行和费用口径；每条视频保留原始记录下钻 ID。
lock: '!inline
  f/content_research/research_dashboard.raw_app/backend/get_daily_briefing.lock'
fields:
  db:
    type: static
    value: $res:f/content_research/research_db
schema:
  type: object
  properties:
    db:
      type: object
      format: resource-postgresql
    hours:
      type: integer
      default: 24
      maximum: 720
      minimum: 1
    limit:
      type: integer
      default: 12
      maximum: 30
      minimum: 1
    platform:
      type: string
      default: all
  required:
    - db
timeout: 15
