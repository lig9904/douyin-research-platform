name: tikhub-paid-v0-batch2

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Use BATCH2_10, or BATCH2_RESUME7 only after a three-call stop"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tikhub-paid-v0
  cancel-in-progress: false

jobs:
  batch2:
    if: ${{ inputs.confirmation == 'BATCH2_10' || inputs.confirmation == 'BATCH2_RESUME7' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install pinned project dependencies
        run: uv sync --extra dev --locked

      - name: Verify SDK probe safety
        run: |
          uv run python -m compileall -q scripts/tikhub/v0_batch2.py
          uv run pytest tests/test_tikhub_v0_batch2.py tests/test_tikhub_transport.py

      - name: Run capped paid batch two
        env:
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          TIKHUB_ENABLE_PAID_BATCH2: ${{ inputs.confirmation }}
        run: uv run python scripts/tikhub/v0_batch2.py

      - name: Remove ephemeral raw responses
        if: always()
        run: |
          test ! -e tmp/tikhub-v0-batch2 || find tmp/tikhub-v0-batch2 -maxdepth 1 -type f -name '*.json' -delete
