name: infra-validate

on:
  push:
    paths:
      - "docker-compose.yml"
      - "docker-compose.l3-local.yml"
      - "docker-compose.local-security.yml"
      - "docker-compose.test-server.yml"
      - ".env.example"
      - ".env.l3-local.example"
      - ".env.local-security.example"
      - ".env.test-server.example"
      - "config/l3-local-*"
      - "config/l3-security-local-*"
      - "db/**"
      - "ops/local-security/**"
      - "ops/test-server/**"
      - "docs/test-server-evidence-v1.schema.json"
      - "docs/test-server-monitoring-contract-v1.schema.json"
      - "scripts/backup.sh"
      - "scripts/local-l3-env.sh"
      - "scripts/local-windmill-sync.sh"
      - "scripts/local-security-env.sh"
      - "scripts/test-server-*"
      - "scripts/verify-stack.sh"
      - ".github/workflows/infra-validate.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "docker-compose.l3-local.yml"
      - "docker-compose.local-security.yml"
      - "docker-compose.test-server.yml"
      - ".env.example"
      - ".env.l3-local.example"
      - ".env.local-security.example"
      - ".env.test-server.example"
      - "config/l3-local-*"
      - "config/l3-security-local-*"
      - "db/**"
      - "ops/local-security/**"
      - "ops/test-server/**"
      - "docs/test-server-evidence-v1.schema.json"
      - "docs/test-server-monitoring-contract-v1.schema.json"
      - "scripts/backup.sh"
      - "scripts/local-l3-env.sh"
      - "scripts/local-windmill-sync.sh"
      - "scripts/local-security-env.sh"
      - "scripts/test-server-*"
      - "scripts/verify-stack.sh"
      - ".github/workflows/infra-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare test env
        run: |
          cp .env.example .env
          cp .env.l3-local.example .env.l3-local
          cp .env.local-security.example .env.local-security
          cp .env.test-server.example .env.test-server

      - name: Validate shell syntax
        run: |
          bash -n db/init/01-bootstrap-research.sh
          bash -n db/init/02-bootstrap-l3-local-reviewer.sh
          bash -n scripts/backup.sh
          bash -n scripts/local-l3-env.sh
          bash -n scripts/local-windmill-sync.sh
          bash -n scripts/local-security-env.sh
          bash -n scripts/test-server-preflight.sh
          bash -n scripts/test-server-globals-restore-drill.sh
          bash -n scripts/test-server-release.sh
          bash -n scripts/test-server-stack-smoke.sh
          bash -n scripts/test-server-windmill-preflight.sh
          bash -n scripts/verify-stack.sh
          bash -n scripts/tikhub/v0_smoke.py 2>/dev/null || true

      - name: Validate evidence tooling
        run: |
          python3 -m py_compile scripts/test-server-evidence.py
          python3 -m py_compile scripts/test-server-backup-verify.py
          python3 -m py_compile scripts/test-server-monitoring-contract.py
          python3 -m json.tool docs/test-server-evidence-v1.schema.json >/dev/null
          python3 -m json.tool docs/test-server-monitoring-contract-v1.schema.json >/dev/null

      - name: Validate compose
        run: |
          docker compose config >/dev/null
          docker compose \
            --env-file .env.l3-local \
            -f docker-compose.yml \
            -f docker-compose.l3-local.yml \
            config >/dev/null
          docker compose -p l3-security-ci \
            --env-file .env.local-security \
            -f docker-compose.yml \
            -f docker-compose.local-security.yml \
            config >/dev/null
          docker compose -p research-test-ci \
            --env-file .env.test-server \
            -f docker-compose.yml \
            -f docker-compose.test-server.yml \
            config >/dev/null

      - name: Validate test-server proxy
        run: |
          mkdir -p work/ci-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=localhost' \
            -keyout work/ci-tls/privkey.pem \
            -out work/ci-tls/fullchain.pem >/dev/null 2>&1
          nginx_image="$(awk -F= '$1 == "NGINX_IMAGE" {sub(/^[^=]*=/, ""); print; exit}' .env.test-server.example)"
          docker run --rm --add-host windmill_server:127.0.0.1 \
            -v "$PWD/ops/test-server/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/work/ci-tls:/etc/nginx/certs:ro" \
            "$nginx_image" nginx -t

      - name: Exercise disposable test-server full stack
        run: TEST_SERVER_STACK_SMOKE=YES scripts/test-server-stack-smoke.sh

      - name: Start PostgreSQL only
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -h 127.0.0.1 -U postgres -d windmill >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres
          exit 1

      - name: Verify research schema
        run: |
          test "$(docker compose exec -T postgres             psql -U postgres -d douyin_research -Atc "select to_regclass('public.source_video');"             | tr -d '\r')" = "source_video"

          count="$(docker compose exec -T postgres             psql -U postgres -d douyin_research -Atc             "select count(*) from pg_catalog.pg_tables where schemaname='public';"             | tr -d '\r')"

          test "$count" -gt 10
          echo "research tables: $count"

      - name: Exercise test-server migration, backup, and restore contract
        run: |
          chmod 600 .env.test-server
          install -d -m 0700 work/release-ci-backups
          compose=(docker compose -p test-server-release-ci --env-file .env.test-server -f docker-compose.yml -f docker-compose.test-server.yml)
          "${compose[@]}" up -d postgres
          for i in {1..30}; do
            if "${compose[@]}" exec -T postgres pg_isready -h 127.0.0.1 -U postgres -d windmill >/dev/null 2>&1; then
              break
            fi
            if [ "$i" = 30 ]; then
              "${compose[@]}" logs postgres
              exit 1
            fi
            sleep 2
          done

          # Windmill normally creates these during server startup. Minimal
          # sentinels keep this release-script integration test PostgreSQL-only.
          "${compose[@]}" exec -T postgres psql -U postgres -d windmill -v ON_ERROR_STOP=1 <<'SQL'
          create table workspace(id text primary key);
          create table usr(id text primary key);
          insert into workspace values ('ci-workspace');
          insert into usr values ('ci-user');
          SQL
          "${compose[@]}" exec -T postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role test_server_ci_grantor login superuser;
          create role test_server_ci_group nologin;
          create role test_server_ci_member login;
          SQL
          "${compose[@]}" exec -T postgres psql -U test_server_ci_grantor -d postgres -v ON_ERROR_STOP=1 \
            -c 'grant test_server_ci_group to test_server_ci_member with admin true, inherit false, set false'

          TEST_SERVER_RESEARCH_MIGRATE=YES scripts/test-server-release.sh migrate \
            --env-file .env.test-server --project test-server-release-ci \
            --backup-root "$PWD/work/release-ci-backups"
          scripts/test-server-release.sh verify \
            --env-file .env.test-server --project test-server-release-ci \
            --backup-root "$PWD/work/release-ci-backups"

          middle_migration="$(find db/migrations -maxdepth 1 -type f -name '*.sql' -print | sort | tail -2 | head -1 | xargs basename)"
          middle_sha="$(sha256sum "db/migrations/$middle_migration" | awk '{print $1}')"
          "${compose[@]}" exec -T postgres psql -U postgres -d douyin_research -v ON_ERROR_STOP=1 \
            -c "delete from schema_migrations where filename='$middle_migration'"
          if TEST_SERVER_RESEARCH_MIGRATE=YES scripts/test-server-release.sh migrate \
            --env-file .env.test-server --project test-server-release-ci \
            --backup-root "$PWD/work/release-ci-backups" >work/non-prefix.out 2>&1; then
            echo "non-prefix migration ledger unexpectedly passed" >&2
            exit 1
          fi
          grep -Fq "not a contiguous reviewed prefix" work/non-prefix.out
          "${compose[@]}" exec -T postgres psql -U postgres -d douyin_research -v ON_ERROR_STOP=1 \
            -c "insert into schema_migrations(filename, sha256) values ('$middle_migration', '$middle_sha')"

          last_migration="$(find db/migrations -maxdepth 1 -type f -name '*.sql' -print | sort | tail -1 | xargs basename)"
          "${compose[@]}" exec -T postgres psql -U postgres -d douyin_research -v ON_ERROR_STOP=1 \
            -c "delete from schema_migrations where filename='$last_migration'"
          sleep 1
          TEST_SERVER_RESEARCH_MIGRATE=YES scripts/test-server-release.sh migrate \
            --env-file .env.test-server --project test-server-release-ci \
            --backup-root "$PWD/work/release-ci-backups"

          sleep 1
          backup_output="$(scripts/test-server-release.sh backup \
            --env-file .env.test-server --project test-server-release-ci \
            --backup-root "$PWD/work/release-ci-backups")"
          backup_dir="${backup_output#BACKUP }"
          TEST_SERVER_RESTORE_DRILL=YES scripts/test-server-release.sh restore-drill \
            --env-file .env.test-server --project test-server-release-ci \
            --backup-root "$PWD/work/release-ci-backups" "$backup_dir"
          postgres_image="$(awk -F= '$1 == "POSTGRES_IMAGE" {sub(/^[^=]*=/, ""); print; exit}' .env.test-server)"
          TEST_SERVER_GLOBALS_RESTORE_DRILL=YES scripts/test-server-globals-restore-drill.sh \
            --backup-root "$PWD/work/release-ci-backups" \
            --postgres-image "$postgres_image" "$backup_dir"

      - name: Start isolated reviewer PostgreSQL
        run: |
          docker compose -p l3-review-ci \
            --env-file .env.l3-local \
            -f docker-compose.yml \
            -f docker-compose.l3-local.yml \
            up -d postgres

          for i in {1..30}; do
            if docker compose -p l3-review-ci \
              --env-file .env.l3-local \
              -f docker-compose.yml \
              -f docker-compose.l3-local.yml \
              exec -T postgres pg_isready -h 127.0.0.1 -U postgres -d windmill >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify isolated reviewer permissions
        run: |
          compose=(docker compose -p l3-review-ci --env-file .env.l3-local -f docker-compose.yml -f docker-compose.l3-local.yml)

          # Prove reprovisioning repairs privilege drift on a reused volume,
          # rather than testing only the pristine first-start path.
          printf '%s\n' \
            'ALTER ROLE :"reviewer_user" INHERIT BYPASSRLS;' \
            'GRANT pg_read_all_data TO :"reviewer_user";' \
            | "${compose[@]}" exec -T postgres psql -U postgres -d windmill \
              -v reviewer_user=l3_local_reviewer -v ON_ERROR_STOP=1
          "${compose[@]}" exec -T postgres \
            bash /docker-entrypoint-initdb.d/02-bootstrap-l3-local-reviewer.sh >/dev/null

          role_row="$(printf '%s\n' \
            "SELECT r.rolinherit, r.rolbypassrls, count(m.roleid) FROM pg_roles r LEFT JOIN pg_auth_members m ON m.member=r.oid WHERE r.rolname=:'reviewer_user' GROUP BY r.rolinherit, r.rolbypassrls;" \
            | "${compose[@]}" exec -T postgres psql -U postgres -d windmill -At \
              -v reviewer_user=l3_local_reviewer \
            | tr -d '\r')"
          test "$role_row" = "f|f|0"

          permission_row="$("${compose[@]}" exec -T postgres bash -c '
            PGPASSWORD="$L3_LOCAL_REVIEWER_PASSWORD" psql \
              -h postgres -U "$L3_LOCAL_REVIEWER_USER" -d "$RESEARCH_DB_NAME" \
              -At -v ON_ERROR_STOP=1 \
              -c "SELECT current_setting('"'"'transaction_read_only'"'"'), has_table_privilege(current_user, '"'"'public.source_video'"'"', '"'"'SELECT'"'"'), has_table_privilege(current_user, '"'"'public.metric_snapshot'"'"', '"'"'SELECT'"'"'), has_table_privilege(current_user, '"'"'public.analysis_run'"'"', '"'"'SELECT'"'"'), has_table_privilege(current_user, '"'"'public.research_task_cost'"'"', '"'"'SELECT'"'"'), has_table_privilege(current_user, '"'"'public.daily_budget'"'"', '"'"'SELECT'"'"'), has_table_privilege(current_user, '"'"'public.human_annotation'"'"', '"'"'SELECT,INSERT'"'"'), has_table_privilege(current_user, '"'"'public.daily_budget'"'"', '"'"'UPDATE'"'"'), has_schema_privilege(current_user, '"'"'public'"'"', '"'"'CREATE'"'"'), has_database_privilege(current_user, current_database(), '"'"'CREATE'"'"'), has_database_privilege(current_user, current_database(), '"'"'TEMPORARY'"'"'), has_database_privilege(current_user, '"'"'windmill'"'"', '"'"'CONNECT'"'"');"
          ' | tr -d '\r')"
          test "$permission_row" = "on|t|t|t|t|t|f|f|f|f|f|f"

          if "${compose[@]}" exec -T postgres bash -c '
            PGPASSWORD="$L3_LOCAL_REVIEWER_PASSWORD" psql \
              -h postgres -U "$L3_LOCAL_REVIEWER_USER" -d "$RESEARCH_DB_NAME" \
              -v ON_ERROR_STOP=1 -c "insert into public.source_video default values;"
          ' >/dev/null 2>&1; then
            echo "reviewer write unexpectedly succeeded" >&2
            exit 1
          fi

      - name: PostgreSQL logs on failure
        if: failure()
        run: docker compose logs postgres

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
          docker compose -p test-server-release-ci \
            --env-file .env.test-server \
            -f docker-compose.yml \
            -f docker-compose.test-server.yml \
            down -v --remove-orphans
          docker compose -p l3-review-ci \
            --env-file .env.l3-local \
            -f docker-compose.yml \
            -f docker-compose.l3-local.yml \
            down -v
