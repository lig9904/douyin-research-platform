name: provider-tests

on:
  push:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "db/schema.sql"
      - "db/migrations/**"
      - "windmill/**"
      - "docker-compose.local-security.yml"
      - "docker-compose.test-server.yml"
      - ".env.local-security.example"
      - ".env.test-server.example"
      - "ops/local-security/**"
      - "ops/test-server/**"
      - "config/l3-security-local-*"
      - "scripts/backup.sh"
      - "scripts/local-l3-env.sh"
      - "scripts/local-security-env.sh"
      - "scripts/test-server-*.sh"
      - "scripts/tikhub/**"
      - "scripts/volcengine/**"
      - "scripts/local-windmill-sync.sh"
      - ".github/workflows/provider-tests.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "db/schema.sql"
      - "db/migrations/**"
      - "windmill/**"
      - "docker-compose.local-security.yml"
      - "docker-compose.test-server.yml"
      - ".env.local-security.example"
      - ".env.test-server.example"
      - "ops/local-security/**"
      - "ops/test-server/**"
      - "config/l3-security-local-*"
      - "scripts/backup.sh"
      - "scripts/local-l3-env.sh"
      - "scripts/local-security-env.sh"
      - "scripts/test-server-*.sh"
      - "scripts/tikhub/**"
      - "scripts/volcengine/**"
      - "scripts/local-windmill-sync.sh"
      - ".github/workflows/provider-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://douyin_research:test-research@127.0.0.1:5432/douyin_research

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --locked

      - name: Bootstrap test database
        env:
          ADMIN_DSN: postgresql://postgres:test-postgres@127.0.0.1:5432/postgres
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          admin = os.environ["ADMIN_DSN"]
          with psycopg.connect(admin, autocommit=True) as conn:
              conn.execute("create role douyin_research login password 'test-research'")
              conn.execute("create database douyin_research owner douyin_research")

          dsn = os.environ["TEST_DATABASE_URL"]
          schema = Path("db/schema.sql").read_text(encoding="utf-8")
          migrations = sorted(Path("db/migrations").glob("*.sql"))
          with psycopg.connect(dsn, autocommit=True) as conn:
              conn.execute(schema, prepare=False)
              # Every migration must also be safe to execute on a database already
              # at the latest schema so migration drift is caught in CI.
              for migration_path in migrations:
                  conn.execute(migration_path.read_text(encoding="utf-8"), prepare=False)
          PY

      - name: Compile
        run: uv run python -m compileall -q src

      - name: Unit and PostgreSQL integration tests
        run: uv run pytest
