name: web-dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - "windmill/f/content_research/research_dashboard.raw_app/**"
      - ".github/workflows/web-dashboard.yml"
  pull_request:
    paths:
      - "windmill/f/content_research/research_dashboard.raw_app/**"
      - ".github/workflows/web-dashboard.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: windmill/f/content_research/research_dashboard.raw_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windmill/f/content_research/research_dashboard.raw_app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Bundle React homepage
        run: >
          npx esbuild index.tsx
          --bundle
          --external:./wmill
          --outdir=/tmp/content-research-dashboard
          --log-level=warning

      - name: Compile Windmill Python backends
        run: python -m compileall -q backend

      - name: Verify transcript rendering and unknown costs
        run: |
          npx esbuild tests/ASRTranscriptPanel.test.tsx --bundle --platform=node --outfile=/tmp/asr-panel-test.cjs --log-level=warning
          node /tmp/asr-panel-test.cjs

      - name: Verify private video preview starts without an external request
        run: node tests/run-video-preview.mjs

      - name: Verify subject profile pending-operation recovery
        run: node tests/run-subject-profile.mjs

      - name: Verify supplier-specific billing periods
        run: |
          npx esbuild tests/DailySpendDisplay.test.ts --bundle --platform=node --outfile=/tmp/daily-spend-display-test.cjs --log-level=warning
          node /tmp/daily-spend-display-test.cjs

      - name: Verify unknown task costs stay unknown
        run: |
          npx esbuild tests/OperationsCostDisplay.test.ts --bundle --platform=node --outfile=/tmp/operations-cost-display-test.cjs --log-level=warning
          node /tmp/operations-cost-display-test.cjs
