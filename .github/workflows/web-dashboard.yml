name: web-dashboard

on:
  push:
    paths:
      - "windmill/f/content_research/research_dashboard.raw_app/**"
      - ".github/workflows/web-dashboard.yml"
  pull_request:
    paths:
      - "windmill/f/content_research/research_dashboard.raw_app/**"
      - ".github/workflows/web-dashboard.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: windmill/f/content_research/research_dashboard.raw_app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: windmill/f/content_research/research_dashboard.raw_app/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Bundle React homepage
        run: >
          npx esbuild index.tsx
          --bundle
          --external:./wmill
          --outdir=/tmp/content-research-dashboard
          --log-level=warning

      - name: Compile Windmill Python backends
        run: python -m compileall -q backend
