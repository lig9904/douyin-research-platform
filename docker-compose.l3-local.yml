# This file is valid only with docker-compose.yml and scripts/local-l3-env.sh.
# The wrapper always supplies -p l3-review-local, keeping containers, network,
# and named volumes separate from the repository's default stack.
services:
  postgres:
    environment:
      L3_LOCAL_REVIEWER_USER: ${L3_LOCAL_REVIEWER_USER:-l3_local_reviewer}
      L3_LOCAL_REVIEWER_PASSWORD: ${L3_LOCAL_REVIEWER_PASSWORD}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - ./db/init/02-bootstrap-l3-local-reviewer.sh:/docker-entrypoint-initdb.d/02-bootstrap-l3-local-reviewer.sh:ro
