worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  # $uri omits query strings; no request headers, Cookie, or Authorization log.
  log_format local_safe '$remote_addr status=$status method=$request_method uri=$uri request_time=$request_time';
  access_log /dev/stdout local_safe;
  error_log /dev/stderr warn;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  limit_req_zone $binary_remote_addr zone=windmill_local:10m rate=10r/s;
  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    location / {
      limit_req zone=windmill_local burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://windmill_server:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
