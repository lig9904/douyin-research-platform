worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # $uri excludes query strings. Never log headers, cookies, Authorization,
  # request bodies, $request, or $args on the shared test server.
  log_format research_safe '$remote_addr status=$status method=$request_method uri=$uri request_time=$request_time';
  access_log /dev/stdout research_safe;
  # Request-level Nginx errors can contain the raw request line. Suppress them;
  # process/configuration failures still use the root stderr log above.
  error_log /dev/null crit;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  limit_req_zone $binary_remote_addr zone=windmill_test:10m rate=10r/s;

  server {
    listen 8080;
    server_name _;
    # Reject plaintext instead of reflecting an untrusted Host header into a
    # redirect. Operators may place a separately reviewed edge redirect ahead
    # of this proxy if product requirements need one.
    return 444;
  }

  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
      limit_req zone=windmill_test burst=30 nodelay;
      proxy_pass http://windmill_server:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Do not preserve a client-supplied forwarding chain.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_buffering off;
    }
  }
}
